spring:
  config:
    import : optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/book_social_network
    username: username
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    protocol: smtp

application:
  security:
    jwt:
      secret-key: mustafaz123456789mustafaz123456789mustafaz123456789
      expiration: 86400000
  mailing:
    frontend:
      activation-url: http://localhost:8080/activate-account?token=
  file:
    uploads:
      photos-output-path: ./uploads
server:
  port: 8088
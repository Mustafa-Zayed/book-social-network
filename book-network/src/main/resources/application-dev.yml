spring:
  config:
    import : optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/book_social_network
    username: username
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: localhost
    port: 1025
    username: mustafaz
    password: mustafaz
    properties:
      mail:
        smtp:
          trust: "*"
        auth: true
        starttls:
          enabled: true
        connectiontimeout: 5000
        timeout: 3000
        writetimeout: 5000

application:
  security:
    jwt:
      secret-key: mustafaz123456789mustafaz123456789mustafaz123456789
      expiration: 86400000
  mailing:
    frontend:
      activation-url: http://localhost:4200/activate-account?token=%s
  file:
    uploads:
      photos-output-path: ./uploads
server:
  port: 8088
<div class="container-fluid card login-container">
  <h3 class="text-center">Create an account</h3>
  <hr />
  @if (errorMsg().length) {
    <div class="alert alert-danger" role="alert">
      @for (msg of errorMsg(); track $index) {
        <p>{{ msg }}</p>
      }
    </div>
  }

  <div class="mb-3">
    <label for="firstname" class="form-label">Firstname</label>
    <input
      [(ngModel)]="registerRequest().firstname"
      (ngModelChange)="registerRequest.set({ ...registerRequest(), firstname: $event })"
      type="text"
      class="form-control"
      id="firstname"
      placeholder="Firstname"
    />
  </div>
  <div class="mb-3">
    <label for="lastname" class="form-label">Lastname</label>
    <input
      [(ngModel)]="registerRequest().lastname"
      (ngModelChange)="registerRequest.set({ ...registerRequest(), lastname: $event })"
      type="text"
      class="form-control"
      id="lastname"
      placeholder="Lastname"
    />
  </div>
  <div class="mb-3">
    <label for="login" class="form-label">Email address</label>
    <input
      [(ngModel)]="registerRequest().email"
      (ngModelChange)="registerRequest.set({ ...registerRequest(), email: $event })"
      type="email"
      class="form-control"
      id="login"
      placeholder="name@example.com"
    />
  </div>
  <div class="mb-3">
    <label for="password" class="form-label">Password</label>
    <input
      [(ngModel)]="registerRequest().password"
      (ngModelChange)="registerRequest.set({ ...registerRequest(), password: $event })"
      type="password"
      class="form-control"
      id="password"
      placeholder="Password"
    />
  </div>
  <div class="d-flex justify-content-between mb-3">
    <button (click)="register()" type="button" class="btn btn-primary">
      <span><i class="fas fa-sign-in-alt"></i>&nbsp;Create an account</span>
    </button>
    <div>
      Already have an account?&nbsp;
      <button (click)="login()" type="button" class="btn btn-link">Login</button>
    </div>
  </div>
</div>
